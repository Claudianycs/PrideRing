<!DOCTYPE html>
<html lang='pt-BR'>

<head>
    <meta charset='UTF-8'>
    <meta name='viewport' content='width=device-width,initial-scale=1'>
    <title>Cadastro - PRiDeRing</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/cadastro.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>

<body class="page-cadastro">
    <div class='card'>
        <h1>Criar Conta</h1>
        <p>Bem-vindo ao PRiDeRing</p>
        <form id='cadastro'>
            <input type='text' placeholder='Nome completo' required>
            <input type='text' placeholder='Pronome (opcional)'>
            <input type='email' placeholder='E-mail' required>
            <input type='password' placeholder='Senha' required>
            <input type='password' placeholder='Confirmar senha' required>
            <textarea placeholder='Bio (opcional)'></textarea>
            <button type='submit'>Cadastrar</button>
        </form>
        <a href='login.html'>Já possui uma conta? Entrar</a>
    </div>
    <script src="javascript/storage.js"></script>
    <script src="javascript/api.js"></script>
    <script src="javascript/cadastro.js"></script>
</body>

</html>
