<!DOCTYPE html>
<html lang='pt-BR'>

<head>
    <meta charset='UTF-8'>
    <meta name='viewport' content='width=device-width,initial-scale=1'>
    <title>Cadastro - PRiDeRing</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/cadastro.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>

<body class="page-cadastro">
    <div class='card'>
        <h1>Criar Conta</h1>
        <p>Bem-vindo ao PRiDeRing</p>
        <form id='cadastro'>
            <input id='name' type='text' placeholder='Nome completo' required>
            <input id='pronoun' type='text' placeholder='Pronome (opcional)'>
            <input id='email' type='email' placeholder='E-mail' required>
            <input id='password' type='password' placeholder='Senha' required minlength="6">
            <input id='confirmPassword' type='password' placeholder='Confirmar senha' required minlength="6">
            <textarea id='bio' placeholder='Bio (opcional)'></textarea>
            <button type='submit' id='submitButton'>Cadastrar</button>
        </form>
        <div class="notice" id="notice" role="status" aria-live="polite"></div>
        <a href='login.html'>Já possui uma conta? Entrar</a>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
    <script src="javascript/supabaseClient.js"></script>
    <script src="javascript/auth.js"></script>
    <script src="javascript/cadastro.js"></script>
</body>

</html>
