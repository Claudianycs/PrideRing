<body class="page-perfil page-with-bottom-navigation">
<header>
<a class="back" href="dashboard.html" aria-label="Voltar">←</a>
<h1>Meu Perfil</h1>
<span></span>
</header>

<main class="container">
<section class="profile-card">
<div class="avatar-wrap">
<div class="avatar" id="avatar"></div>
<button class="photo-button" type="button" id="photoButton" aria-label="Alterar foto">+</button>
<input type="file" id="photoInput" accept="image/*" hidden>
</div>
<h2 id="previewName">Seu nome</h2>
<p id="previewPronoun">Pronome não informado</p>
</section>

<section class="form-card">
<form id="profileForm">
<div class="field">
<label for="name">Nome</label>
<input id="name" type="text" placeholder="Digite seu nome" required>
</div>

<div class="field">
<label for="pronoun">Pronome</label>
<input id="pronoun" type="text" placeholder="Ex.: ela/dela">
</div>

<div class="field">
<label for="bio">Bio</label>
<textarea id="bio" placeholder="Conte um pouco sobre você"></textarea>
</div>

<div class="field">
<label for="instagram">Instagram</label>
<input id="instagram" type="text" placeholder="@usuario">
</div>

<div class="field">
<label for="whatsapp">WhatsApp</label>
<input id="whatsapp" type="tel" placeholder="(00) 00000-0000">
</div>

<button class="save" type="submit">Salvar alterações</button>
<div class="message" id="message">Perfil atualizado com sucesso.</div>
</form>
</section>
</main>
