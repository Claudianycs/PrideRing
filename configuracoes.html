<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Configurações - PRiDeRing</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/configuracoes.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>

<body class="page-configuracoes page-with-bottom-navigation">

    <header>
        <a href="dashboard.html">←</a>
        <h1>Configurações</h1>
        <span></span>
    </header>

    <div class="container">

        <div class="card">
            <h2>Aparência</h2>

            <div class="item">
                <span>Modo Escuro</span>
                <label class="switch">
<input type="checkbox" id="darkMode" checked>
<span class="slider"></span>
</label>
            </div>

            <div class="item">
                <span>Animações</span>
                <label class="switch">
<input type="checkbox" id="animations" checked>
<span class="slider"></span>
</label>
            </div>

        </div>

        <div class="card">
            <h2>Privacidade</h2>

            <div class="item">
                <span>Salvar histórico de conexões</span>
                <label class="switch">
<input type="checkbox" id="history" checked>
<span class="slider"></span>
</label>
            </div>

            <div class="item">
                <span>Permitir compartilhamento NFC</span>
                <label class="switch">
<input type="checkbox" id="sharing" checked>
<span class="slider"></span>
</label>
            </div>

        </div>

        <div class="card">

            <h2>Segurança</h2>

            <div class="field">
                <label for="newPassword">Nova senha</label>
                <input id="newPassword" type="password" placeholder="Mínimo 6 caracteres" autocomplete="new-password">
            </div>

            <div class="field">
                <label for="confirmPassword">Confirmar nova senha</label>
                <input id="confirmPassword" type="password" placeholder="Repita a nova senha" autocomplete="new-password">
            </div>

            <button id="changePassword">Alterar senha</button>

            <div class="notice" id="passwordNotice"></div>

        </div>

        <div class="card">

            <h2>Conta</h2>

            <button id="save">Salvar Configurações</button>

            <button class="danger" id="logout">
Sair da Conta
</button>

            <div class="notice" id="notice">
                Configurações salvas com sucesso.
            </div>

        </div>

    </div>

    <nav class="bottom-navigation" aria-label="Navegação principal">
        <a href="dashboard.html" class="nav-item">
            <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="m3 11 9-8 9 8"></path>
                <path d="M5 10v11h14V10"></path>
                <path d="M9 21v-7h6v7"></path>
            </svg>
            <span>Início</span>
        </a>
        <a href="perfil.html" class="nav-item">
            <svg viewBox="0 0 24 24" aria-hidden="true">
                <circle cx="12" cy="8" r="4"></circle>
                <path d="M4.5 21a7.5 7.5 0 0 1 15 0"></path>
            </svg>
            <span>Perfil</span>
        </a>
        <a href="conexoes.html" class="nav-item nav-main-action" aria-label="Abrir minhas conexões">
            <span class="nav-main-icon">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <circle cx="8" cy="8" r="3"></circle>
                    <circle cx="17" cy="8" r="3"></circle>
                    <path d="M2.5 20a5.5 5.5 0 0 1 11 0"></path>
                    <path d="M11 20a6 6 0 0 1 11 0"></path>
                </svg>
            </span>
            <span>Conexões</span>
        </a>
        <a href="cadastrar-nfc.html" class="nav-item">
            <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M8 6a8.5 8.5 0 0 1 8 0"></path>
                <path d="M9.8 9a5.5 5.5 0 0 1 4.4 0"></path>
                <path d="M11 12a2.4 2.4 0 0 1 2 0"></path>
                <circle cx="12" cy="15" r="1.4"></circle>
            </svg>
            <span>NFC</span>
        </a>
        <a href="configuracoes.html" class="nav-item active" aria-current="page">
            <svg viewBox="0 0 24 24" aria-hidden="true">
                <circle cx="12" cy="12" r="3"></circle>
                <path d="M19.4 15a7.8 7.8 0 0 0 .1-1 7.8 7.8 0 0 0-.1-1l2-1.5-2-3.5-2.4 1a8 8 0 0 0-1.7-1L15 5h-4l-.4 3a8 8 0 0 0-1.7 1l-2.4-1-2 3.5 2 1.5a7.8 7.8 0 0 0-.1 1 7.8 7.8 0 0 0 .1 1l-2 1.5 2 3.5 2.4-1a8 8 0 0 0 1.7 1l.4 3h4l.4-3a8 8 0 0 0 1.7-1l2.4 1 2-3.5-2.1-1.5Z"></path>
            </svg>
            <span>Ajustes</span>
        </a>
    </nav>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
    <script src="javascript/supabaseClient.js"></script>
    <script src="javascript/auth.js"></script>
    <script src="javascript/configuracoes.js"></script>
</body>

</html>
