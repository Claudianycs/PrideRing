<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Configurações - PRiDeRing</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/configuracoes.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>

<body class="page-configuracoes">

    <header>
        <a href="dashboard.html">←</a>
        <h1>Configurações</h1>
        <span></span>
    </header>

    <div class="container">

        <div class="card">
            <h2>Aparência</h2>

            <div class="item">
                <span>Modo Escuro</span>
                <label class="switch">
<input type="checkbox" id="darkMode" checked>
<span class="slider"></span>
</label>
            </div>

            <div class="item">
                <span>Animações</span>
                <label class="switch">
<input type="checkbox" id="animations" checked>
<span class="slider"></span>
</label>
            </div>

        </div>

        <div class="card">
            <h2>Privacidade</h2>

            <div class="item">
                <span>Salvar histórico de conexões</span>
                <label class="switch">
<input type="checkbox" id="history" checked>
<span class="slider"></span>
</label>
            </div>

            <div class="item">
                <span>Permitir compartilhamento NFC</span>
                <label class="switch">
<input type="checkbox" id="sharing" checked>
<span class="slider"></span>
</label>
            </div>

        </div>

        <div class="card">

            <h2>Conta</h2>

            <button id="save">Salvar Configurações</button>

            <button class="danger" id="logout">
Sair da Conta
</button>

            <div class="notice" id="notice">
                Configurações salvas com sucesso.
            </div>

        </div>

    </div>

    <nav>
        <a href="dashboard.html">Início</a>
        <a href="perfil.html">Perfil</a>
        <a class="active" href="configuracoes.html">Config.</a>
    </nav>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
    <script src="javascript/supabaseClient.js"></script>
    <script src="javascript/auth.js"></script>
    <script src="javascript/configuracoes.js"></script>
</body>

</html>
